<svg xmlns="http://www.w3.org/2000/svg" width="880" height="360" viewBox="0 0 880 360" role="img" aria-labelledby="title desc">
  <title id="title">One run_steps call from an AI agent to the browser</title>
  <desc id="desc">An AI agent sends one run_steps call with five steps: dismiss a cookie banner if one is showing, type an email address, click Sign up, wait for either a welcome or an error message, and read the message. The server runs them in the agent's Chrome, Edge, or Firefox and returns one reply with every step's result.</desc>
  <style>
    .bg { fill: #f6f8fa; stroke: #d1d9e0; }
    .card { fill: #ffffff; stroke: #d1d9e0; }
    .panel { fill: #ffffff; stroke: #0969da; }
    .chip { fill: #eef4ff; }
    .accent { fill: #0969da; }
    .accent-line { stroke: #0969da; fill: none; }
    .rule { stroke: #d1d9e0; }
    .text { fill: #1f2328; }
    .muted { fill: #59636e; }
    .on-accent { fill: #ffffff; }
    .sans { font-family: ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; stroke: #3d444d; }
      .card { fill: #151b23; stroke: #3d444d; }
      .panel { fill: #151b23; stroke: #4493f8; }
      .chip { fill: #1a2740; }
      .accent { fill: #4493f8; }
      .accent-line { stroke: #4493f8; }
      .rule { stroke: #3d444d; }
      .text { fill: #f0f6fc; }
      .muted { fill: #9198a1; }
      .on-accent { fill: #0d1117; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path class="accent" d="M0 0 L10 5 L0 10 z"/>
    </marker>
  </defs>

  <rect class="bg" x="0.5" y="0.5" width="879" height="359" rx="16"/>

  <!-- Agent -->
  <rect class="card" x="32" y="92" width="176" height="136" rx="12"/>
  <path class="accent" d="M104 108 h32 a8 8 0 0 1 8 8 v16 a8 8 0 0 1 -8 8 h-20 l-8 7 v-7 h-4 a8 8 0 0 1 -8 -8 v-16 a8 8 0 0 1 8 -8 z"/>
  <circle class="on-accent" cx="112" cy="124" r="2.5"/>
  <circle class="on-accent" cx="120" cy="124" r="2.5"/>
  <circle class="on-accent" cx="128" cy="124" r="2.5"/>
  <text class="text sans" x="120" y="176" text-anchor="middle" font-size="17" font-weight="600">AI agent</text>
  <text class="muted sans" x="120" y="198" text-anchor="middle" font-size="12">Claude Code, Codex,</text>
  <text class="muted sans" x="120" y="214" text-anchor="middle" font-size="12">Cursor, or any MCP client</text>

  <!-- One call -->
  <line class="accent-line" x1="212" y1="160" x2="254" y2="160" stroke-width="2" marker-end="url(#arrow)"/>
  <rect class="panel" x="260" y="36" width="360" height="256" rx="14" stroke-width="1.5"/>
  <text class="text mono" x="282" y="66" font-size="15" font-weight="700">run_steps</text>
  <text class="muted sans" x="598" y="66" text-anchor="end" font-size="12">one tool call</text>
  <line class="rule" x1="276" y1="80" x2="604" y2="80"/>

  <rect class="chip" x="276" y="92" width="328" height="32" rx="8"/>
  <circle class="accent" cx="296" cy="108" r="10"/>
  <text class="on-accent sans" x="296" y="112" text-anchor="middle" font-size="11" font-weight="700">1</text>
  <text x="316" y="113"><tspan class="text mono" font-size="13" font-weight="700">if</tspan><tspan class="muted sans" font-size="12.5" dx="10">cookie banner showing? click it</tspan></text>

  <rect class="chip" x="276" y="132" width="328" height="32" rx="8"/>
  <circle class="accent" cx="296" cy="148" r="10"/>
  <text class="on-accent sans" x="296" y="152" text-anchor="middle" font-size="11" font-weight="700">2</text>
  <text x="316" y="153"><tspan class="text mono" font-size="13" font-weight="700">type</tspan><tspan class="muted sans" font-size="12.5" dx="10">email address</tspan></text>

  <rect class="chip" x="276" y="172" width="328" height="32" rx="8"/>
  <circle class="accent" cx="296" cy="188" r="10"/>
  <text class="on-accent sans" x="296" y="192" text-anchor="middle" font-size="11" font-weight="700">3</text>
  <text x="316" y="193"><tspan class="text mono" font-size="13" font-weight="700">click</tspan><tspan class="muted sans" font-size="12.5" dx="10">Sign up</tspan></text>

  <rect class="chip" x="276" y="212" width="328" height="32" rx="8"/>
  <circle class="accent" cx="296" cy="228" r="10"/>
  <text class="on-accent sans" x="296" y="232" text-anchor="middle" font-size="11" font-weight="700">4</text>
  <text x="316" y="233"><tspan class="text mono" font-size="13" font-weight="700">wait_for</tspan><tspan class="muted sans" font-size="12.5" dx="10">“Welcome” or an error, first to show</tspan></text>

  <rect class="chip" x="276" y="252" width="328" height="32" rx="8"/>
  <circle class="accent" cx="296" cy="268" r="10"/>
  <text class="on-accent sans" x="296" y="272" text-anchor="middle" font-size="11" font-weight="700">5</text>
  <text x="316" y="273"><tspan class="text mono" font-size="13" font-weight="700">inspect_element</tspan><tspan class="muted sans" font-size="12.5" dx="10">read the message</tspan></text>

  <!-- Browser -->
  <line class="accent-line" x1="624" y1="160" x2="666" y2="160" stroke-width="2" marker-end="url(#arrow)"/>
  <rect class="card" x="672" y="92" width="176" height="136" rx="12"/>
  <rect class="accent-line" x="738" y="108" width="44" height="34" rx="5" stroke-width="2"/>
  <line class="accent-line" x1="738" y1="118" x2="782" y2="118" stroke-width="2"/>
  <circle class="accent" cx="744" cy="113" r="1.6"/>
  <circle class="accent" cx="749" cy="113" r="1.6"/>
  <circle class="accent" cx="754" cy="113" r="1.6"/>
  <text class="text sans" x="760" y="176" text-anchor="middle" font-size="17" font-weight="600">Your browser</text>
  <text class="muted sans" x="760" y="198" text-anchor="middle" font-size="12">Chrome, Edge, or Firefox</text>
  <text class="muted sans" x="760" y="214" text-anchor="middle" font-size="12">logins and tabs as they are</text>

  <!-- One reply -->
  <path class="accent-line" d="M760 232 V312 H120 V236" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
  <text class="text sans" x="440" y="338" text-anchor="middle" font-size="13" font-weight="600">One reply with every step’s result</text>
</svg>
